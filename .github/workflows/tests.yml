name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
      - run: python -m build
      - name: Exercise installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv --system-site-packages /tmp/compy-wheel
          /tmp/compy-wheel/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/compy-wheel/bin/python -c "import compy, inv_compy, compy_diagnostics; assert '/tmp/compy-wheel/' in compy.__file__, compy.__file__"
          /tmp/compy-wheel/bin/python "$GITHUB_WORKSPACE/_Example/synthetic_inversion.py"
          # compy_pressure: package data in the wheel, console scripts on PATH
          /tmp/compy-wheel/bin/python -c "import compy_pressure.network as n, compy_pressure.pressure_test as t; assert '/tmp/compy-wheel/' in n.__file__, n.__file__; assert len(t.load_references()[1]) > 10"
          /tmp/compy-wheel/bin/compy-pressure --help > /dev/null
          /tmp/compy-wheel/bin/compy-pressure-noise-model --help > /dev/null
          MPLBACKEND=Agg /tmp/compy-wheel/bin/python "$GITHUB_WORKSPACE/_Example/5_Pressure_QC.py" --output /tmp/compy-pressure-qc
      - name: Run reproducible multi-chain benchmark
        if: matrix.python == '3.12'
        run: MPLBACKEND=Agg python _Example/reproducible_inversion.py --output "$RUNNER_TEMP/compy-synthetic" --iterations 250 --burnin 50
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: synthetic-inversion-record
          path: ${{ runner.temp }}/compy-synthetic
