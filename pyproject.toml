[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compy-seafloor"
version = "0.2.0"
description = "Seafloor compliance processing, pressure-gauge calibration, and shear-velocity inversion for ocean-bottom seismic data."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Mohammad-Amin Aminian"}]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "matplotlib>=3.6",
  "obspy>=1.4",
  "tiskitpy",
  "disba"
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/MohammadAmin-Aminian/ComPy"
Publication = "https://doi.org/10.1093/gji/ggaf253"
Archive = "https://doi.org/10.5281/zenodo.13380107"

[tool.setuptools]
py-modules = ["compy", "inv_compy", "Pressure_calibration", "ffplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
