[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seafloor-compy"
version = "1.3.3.0"
description = "Toolbox for ocean-bottom seismic and pressure data: compliance, pressure-gauge calibration and noise, Bayesian inversion"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Mohammad-Amin Aminian"}]
keywords = ["seafloor compliance", "ocean-bottom seismometer", "OBS", "differential pressure gauge", "shear velocity", "Bayesian inversion", "seismology", "ObsPy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "obspy>=1.4", "tiskitpy>=2.3,<3", "disba>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9", "build>=1", "arviz>=0.19,<0.23", "pandas>=2.2", "openpyxl>=3.1", "numba>=0.59"]
diagnostics = ["arviz>=0.19,<0.23"]
fast = ["numba>=0.59"]
# compy_pressure: pressure-gauge QC, calibration and noise models (docs/PRESSURE.md)
pressure = ["pandas>=2.2", "openpyxl>=3.1"]
maps = ["cartopy>=0.24"]

[project.scripts]
compy-invert = "compy.inversion.cli:main"
compy-pressure = "compy_pressure._commands:network"
compy-pressure-inventory = "compy_pressure._commands:inventory"
compy-pressure-tilt = "compy_pressure._commands:tilt"
compy-pressure-local-p = "compy_pressure._commands:local_p"
compy-pressure-microseism = "compy_pressure._commands:microseism"
compy-pressure-paired = "compy_pressure._commands:paired"
compy-pressure-noise-model = "compy_pressure._commands:noise_model"
compy-pressure-approved-noise-model = "compy_pressure._commands:approved_noise_model"
compy-pressure-atlas = "compy_pressure._commands:atlas"

[project.urls]
Repository = "https://github.com/MohammadAmin-Aminian/ComPy"
Publication = "https://doi.org/10.1093/gji/ggaf253"
Documentation = "https://github.com/MohammadAmin-Aminian/ComPy/blob/main/docs/USER_GUIDE.md"
Changelog = "https://github.com/MohammadAmin-Aminian/ComPy/blob/main/CHANGELOG.md"

[tool.setuptools]
# The compy package, plus ComPy 1.2.x module names kept as deprecated aliases.
py-modules = ["inv_compy", "ffplot", "compy_numerics", "compy_streams", "compy_processing", "compy_diagnostics", "compy_cleaning", "compy_inversion"]
# reference_data is listed as a (data-only) package so that setuptools ships it.
packages = ["compy", "compy.inversion", "compy.plotting", "compy_pressure", "compy_pressure.atlas", "compy_pressure.reference_data"]

[tool.setuptools.package-data]
"compy_pressure.reference_data" = ["*.csv", "*.json"]

[tool.pytest.ini_options]
# pressure/ is PressureQC's project folder: its tests import its scripts/.
testpaths = ["tests", "pressure/tests"]
pythonpath = [".", "pressure"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811"]
